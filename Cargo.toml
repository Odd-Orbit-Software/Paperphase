[workspace]
resolver = "3"
members = ["crates/*", "examples/temperature-plugin", "plugins/*"]
default-members = ["crates/paperphase", "crates/paperphase-core", "crates/paperphase-render", "crates/paperphase-runtime", "crates/paperphase-plugin-sdk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Odd Orbit Software"]
repository = "https://github.com/Odd-Orbit-Software/Paperphase"
publish = false

[workspace.dependencies]
csv = "1.4"
flate2 = "1.1"
crc32fast = "1.5"
anyhow = "1.0"
axum = "0.8.9"
base64 = "0.22"
if-addrs = "0.15"
httpdate = "1.0"
clap = { version = "4.6", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
fontdue = { version = "0.9.5", default-features = false, features = ["std"] }
png = "0.18.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "signal", "sync", "time", "macros"] }
wasmtime = { version = "48.0.8", default-features = false, features = ["std", "runtime", "cranelift"] }
wat = "1.0"
url = "2.5.8"
quick-xml = "0.42.0"
html-escape = "0.3.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"

[profile.dev]
debug = 1
